[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph_dl"
version = "0.1.0"
description = "Online graph learning and joint dictionary learning in PyTorch"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Rachid"}
]
keywords = ["graph-learning", "dictionary-learning", "pytorch", "fmri"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "pandas>=2.0",
    "networkx>=3.0",
    "pygsp>=0.5.1",
    "scikit-learn>=1.3",
    "qpth>=0.0.16",
    "quadprog>=0.1.11",
]

[project.optional-dependencies]
fmri = [
    "nibabel>=5.0",
    "nilearn>=0.10",
    "dipy>=1.7",
]
plot = [
    "opencv-python>=4.8",
    "PyWavelets>=1.4",
    "scikit-image>=0.21",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
]
all = [
    "graph_dl[fmri,plot,dev]"
]

[project.urls]
Homepage = "https://github.com/Rachid/graph_dl"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]
exclude = ["tests*", "logs*", "results*", "data*", "img*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py38"
line-length = 120
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.pydocstyle]
convention = "google"
